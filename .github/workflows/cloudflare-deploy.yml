# Deploys to the Cloudflare Worker in parallel with GitHub Pages during the
# migration prep window (docs/plans/cloudflare-pages-migration.md). GitHub
# Pages remains the live production target until the DNS cutover -- this
# keeps the Worker continuously up to date so it's already proven by the
# time that happens, not deployed for the first time at cutover.
name: Deploy to Cloudflare

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "cloudflare-deploy"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack + prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir .pnpm-store

      - name: Build site
        run: pnpm build

      - name: Deploy Worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
